# Nothing is built on the VPS: a Next.js build needs ~2 GB and starves Warcon and cloudflared on the
# 4 GB box. CI builds the image and pushes it to ghcr.io; scripts/deploy.sh pulls it, runs the doctor
# in it, and tags it teg-wardogs-site:current, which is what runs here.
#
#   docker compose up -d                    (re)start whatever was last deployed
#   docker compose run --rm doctor          checks the Warcon key and every endpoint, in that image
#   sh scripts/deploy.sh <commit sha>       deploy or roll back to that commit's image
#
# Build locally instead (not on the VPS): docker build -t teg-wardogs-site:current .

services:
  site:
    image: teg-wardogs-site:current
    # Never pull or build on `up`: only deploy.sh changes what :current points at.
    pull_policy: never
    container_name: teg-wardogs-site
    restart: unless-stopped
    env_file: .env
    ports:
      # Loopback only: the public reaches it through the Cloudflare tunnel. Warcon already holds
      # 127.0.0.1:3000 on the VPS, so the site defaults to 3100. SITE_HOST_PORT, not PORT: PORT in
      # .env would also move the port the app listens on inside the container.
      - '127.0.0.1:${SITE_HOST_PORT:-3100}:3000'
    networks: [warcon]
    # Linked Discord/Steam accounts (accounts.db, back this up) and history.db (rounds, daily board snapshots).
    volumes:
      - site-data:/app/data
    stop_grace_period: 15s
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }

  doctor:
    # deploy.sh points this at the image it is about to deploy, to check it before the swap.
    image: ${DOCTOR_IMAGE:-teg-wardogs-site:current}
    pull_policy: never
    profiles: [tools]
    env_file: .env
    networks: [warcon]
    command: ['node', 'doctor.mjs']

volumes:
  site-data:

networks:
  warcon:
    external: true
    # Warcon's compose project lives in /home/debian/warcon, so its default network is warcon_default.
    name: warcon_default
