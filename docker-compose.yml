# docker compose up -d --build            the site, on 127.0.0.1:3000 and the warcon_default network
# docker compose run --rm doctor          checks the Warcon key and every endpoint (deploy gate)

services:
  site:
    build: .
    image: teg-wardogs-site:latest
    container_name: teg-wardogs-site
    restart: unless-stopped
    env_file: .env
    ports:
      # Loopback only: the public reaches it through the Cloudflare tunnel. Warcon already holds
      # 127.0.0.1:3000 on the VPS, so the site defaults to 3100. SITE_HOST_PORT, not PORT: PORT in
      # .env would also move the port the app listens on inside the container.
      - '127.0.0.1:${SITE_HOST_PORT:-3100}:3000'
    networks: [warcon]
    stop_grace_period: 15s
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }

  doctor:
    build: { context: ., target: build }
    profiles: [tools]
    env_file: .env
    environment: { HOME: /tmp }
    networks: [warcon]
    command: ['node_modules/.bin/tsx', 'scripts/doctor.ts']

networks:
  warcon:
    external: true
    # Warcon's compose project lives in /home/debian/warcon, so its default network is warcon_default.
    name: warcon_default
