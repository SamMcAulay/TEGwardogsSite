# Deploys main to the VPS over SSH after CI passes: scripts/deploy.sh resets the clone to origin/main,
# builds, runs the doctor against Warcon, and only then replaces the running container.
#
# Off until you set it up (repo Settings > Secrets and variables > Actions):
#   Variables: DEPLOY_ENABLED = true
#   Secrets:   VPS_HOST, VPS_USER, VPS_SSH_KEY (private key whose public half is in the VPS user's
#              ~/.ssh/authorized_keys), optional VPS_HOST_KEY (the host's public key line, pinned in known_hosts)
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: SSH key
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          if [ -n "$HOST_KEY" ]; then
            printf '%s %s\n' "$HOST" "$HOST_KEY" >> ~/.ssh/known_hosts
          else
            ssh-keyscan "$HOST" >> ~/.ssh/known_hosts
          fi
      - name: Deploy
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/id_deploy "$USER@$HOST" \
            'DEPLOY_DIR=/home/debian/teg-wardogs-site sh /home/debian/teg-wardogs-site/scripts/deploy.sh'
