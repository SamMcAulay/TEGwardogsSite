<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07090c">
<title>Offline · TEG WARDOGS Stats</title>
<style>
  :root { --bg: #07090c; --text: #e6e9ee; --muted: #8b93a1; --accent: #f2b33d; --ink: #1a1204; }
  @media (prefers-color-scheme: light) { :root { --bg: #f3f4f6; --text: #111418; --muted: #5b6472; --accent: #b87700; --ink: #fff; } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, sans-serif; }
  main { min-height: 100%; display: grid; place-content: center; gap: 12px; padding: 24px; text-align: center; }
  .mark { justify-self: center; background: var(--accent); color: var(--ink); font: 700 22px/1 system-ui, sans-serif; letter-spacing: .04em; padding: 8px 10px; }
  h1 { margin: 8px 0 0; font-size: 22px; letter-spacing: .02em; text-transform: uppercase; }
  p { margin: 0; color: var(--muted); max-width: 22rem; }
  button { justify-self: center; margin-top: 8px; padding: 10px 18px; border: 1px solid var(--accent); background: transparent; color: var(--accent); font: 600 13px/1 system-ui, sans-serif; letter-spacing: .1em; text-transform: uppercase; }
</style>
</head>
<body>
<main>
  <div class="mark">TEG</div>
  <h1>You're offline</h1>
  <p>The stats are live, so they need a connection. Check your signal and try again.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
