<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#16131c">
<title>Offline · TEG WARDOGS Stats</title>
<style>
  :root { --bg: #16131c; --text: #f4efe6; --muted: #b3aabd; --accent: #ffc93c; --ink: #1d1606; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, sans-serif; }
  main { min-height: 100%; display: grid; place-content: center; gap: 12px; padding: 24px; text-align: center; }
  .mark { justify-self: center; background: var(--accent); color: var(--ink); font: 800 22px/1 system-ui, sans-serif; padding: 8px 14px; border: 3px solid #07060a; border-radius: 14px; box-shadow: 0 4px 0 #07060a; }
  h1 { margin: 8px 0 0; font-size: 22px; letter-spacing: .02em; text-transform: uppercase; }
  p { margin: 0; color: var(--muted); max-width: 22rem; }
  button { justify-self: center; margin-top: 8px; padding: 10px 20px; border: 3px solid #07060a; border-radius: 999px; box-shadow: 0 4px 0 #07060a; background: var(--accent); color: var(--ink); font: 700 15px/1 system-ui, sans-serif; }
</style>
</head>
<body>
<main>
  <div class="mark">TEG</div>
  <h1>You're offline</h1>
  <p>The stats are live, so they need a connection. Check your signal and try again.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
