# nginx in front of the site, for when you'd rather open 443 than run a Cloudflare Tunnel.
# Cloudflare DNS record proxied (orange cloud), SSL/TLS mode "Full (strict)", and a Cloudflare
# Origin Certificate (SSL/TLS > Origin Server) saved at the paths below.
#
#   sudo cp deploy/nginx/teg-wardogs.conf /etc/nginx/sites-available/
#   sudo ln -s ../sites-available/teg-wardogs.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Firewall 80/443 to Cloudflare's ranges only (https://www.cloudflare.com/ips/) so nobody can
# bypass Cloudflare by hitting the VPS IP directly.

# Real visitor IPs from Cloudflare. Keep in sync with https://www.cloudflare.com/ips/
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

upstream teg_wardogs {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name stats.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name stats.example.com;

    ssl_certificate     /etc/ssl/cloudflare/stats.example.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/stats.example.com.key;

    # Kill feed batches are at most 500 events.
    client_max_body_size 2m;

    location /_next/static/ {
        proxy_pass http://teg_wardogs;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://teg_wardogs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
}
